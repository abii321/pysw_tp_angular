<div class="container mt-4">
    <div class="card shadow-lg border-0 position-relative overflow-hidden mx-auto" style="max-width: 800px;">

        <div class="ratio ratio-16x9">
            <img [src]="'assets/images/punto1/' + eventos[indice].img" class="object-fit-cover" alt="Evento">
        </div>

        <div class="position-absolute bottom-0 start-0 w-100 p-4 text-white"
            style="background: linear-gradient(transparent, rgba(0,0,0,0.85));">

            <h2 class="display-6 fw-bold mb-1">{{ eventos[indice].nombre }}</h2> 
            <p class="lead mb-3">{{ eventos[indice].descripcion }}</p> 

            <div class="d-flex gap-2">
                <button (click)="anterior()" class="btn btn-outline-light rounded-pill px-4" [disabled]="indice === 0">
                    <i class="bi bi-chevron-left"></i> Anterior
                </button> 

                <button (click)="siguiente()" class="btn btn-outline-light rounded-pill px-4"
                    [disabled]="indice === eventos.length - 1">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </button> 
            </div>
        </div>

    </div>
</div>
